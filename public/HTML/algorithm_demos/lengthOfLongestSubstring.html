<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>无重复字符的最长子串 - 算法演示</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .char-box { display: inline-block; width: 30px; height: 30px; line-height: 30px; text-align: center; margin: 2px; border: 1px solid #ccc; border-radius: 4px; transition: all 0.3s; }
    .char-active { background-color: #0d6efd; color: white; border-color: #0d6efd; transform: scale(1.1); }
    .char-in-window { background-color: #e9ecef; }
    [data-theme='dark'] .char-in-window { background-color: #495057; }
    .char-left-ptr { border-left: 2px solid #dc3545; }
    .char-right-ptr { border-right: 2px solid #198754; }
    .highlight { background-color: #fff3cd; padding: .2em .4em; border-radius: .3rem; }
    [data-theme='dark'] .highlight { color: #000; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">最长无重复子串 (滑动窗口)</h1>
        <a href="." class="btn btn-sm btn-outline-secondary">返回索引</a>
    </div>
    <p class="text-muted">通过“滑动窗口”技术动态寻找最长的无重复字符子串。</p>
    <div class="row">
      <div class="col-lg-5 mb-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">控制面板</h5>
            <div class="mb-3">
              <label for="inputStr" class="form-label">测试字符串:</label>
              <input id="inputStr" type="text" class="form-control" value="abcabcbb" placeholder="输入字符串">
            </div>
            <div class="d-flex gap-2 mb-3">
              <button id="stepBtn" class="btn btn-primary">单步</button>
              <button id="runBtn" class="btn btn-success">自动</button>
              <button id="resetBtn" class="btn btn-danger">重置</button>
            </div>
            <div class="card bg-light flex-grow-1">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">滑动窗口状态</h6>
                    <p class="mb-1">窗口内容: <span id="windowContent" class="highlight font-monospace">""</span></p>
                    <p class="mb-1">当前长度: <span id="windowLen" class="highlight">0</span></p>
                    <p class="mb-1">最大长度: <span id="maxLen" class="highlight">0</span></p>
                </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7 mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">执行过程</h5>
            <div class="mb-3">
              <h6>字符串可视化:</h6>
              <div id="stringVisualization" class="p-3 bg-light rounded font-monospace d-flex align-items-center"></div>
            </div>
            <div class="mb-3">
                <h6>当前操作说明:</h6>
                <div id="currentOperation" class="alert alert-info" role="alert">准备就绪。</div>
            </div>
            <div>
              <h6>算法思路 (滑动窗口):</h6>
              <div id="algorithmSteps" class="small text-muted">
                1. 维护一个“窗口”(子串)，用左右两个指针(L, R)表示它的边界。<br>
                2. <strong>扩展</strong>: 不断移动右指针R，将新字符纳入窗口。<br>
                3. <strong>收缩</strong>: 如果新字符在窗口中已存在，就移动左指针L，直到窗口内不再有重复字符。<br>
                4. 每次扩展后，记录并更新窗口的最大长度。<br>
                5. 重复此过程，直到右指针R到达字符串末尾。
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="theme-switcher" class="theme-switcher btn btn-light">🌙</div>
  <script src="../js/theme-switcher.js"></script>
  <script>
    // DOM references
    const inputStrEl = document.getElementById('inputStr');
    const stepBtn = document.getElementById('stepBtn');
    const runBtn = document.getElementById('runBtn');
    const resetBtn = document.getElementById('resetBtn');
    const windowContentEl = document.getElementById('windowContent');
    const windowLenEl = document.getElementById('windowLen');
    const maxLenEl = document.getElementById('maxLen');
    const stringVisualizationEl = document.getElementById('stringVisualization');
    const currentOperationEl = document.getElementById('currentOperation');

    // Algorithm state
    let s = "abcabcbb";
    let left = 0;
    let right = 0;
    let maxLength = 0;
    let charSet = new Set();
    let isRunning = false;
    let intervalId = null;

    function renderString() {
      stringVisualizationEl.innerHTML = '';
      for (let i = 0; i < s.length; i++) {
        const charBox = document.createElement('span');
        charBox.className = 'char-box';
        charBox.textContent = s[i];
        
        if (i === right) charBox.classList.add('char-active');
        if (i >= left && i < right) charBox.classList.add('char-in-window');
        if (i === left) charBox.classList.add('char-left-ptr');
        if (i === right) charBox.classList.add('char-right-ptr');
        
        stringVisualizationEl.appendChild(charBox);
      }
    }

    function updateDisplay() {
        let currentWindow = s.substring(left, right);
        windowContentEl.textContent = `"${currentWindow}"`;
        windowLenEl.textContent = currentWindow.length;
        maxLenEl.textContent = maxLength;
        renderString();
    }
    
    function resetAlgorithm() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        runBtn.textContent = "自动";
      }
      s = inputStrEl.value || "abcabcbb";
      left = 0;
      right = 0;
      maxLength = 0;
      charSet.clear();
      currentOperationEl.textContent = "已重置。点击“单步”或“自动”开始。";
      currentOperationEl.className = "alert alert-info";
      updateDisplay();
    }

    function stepAlgorithm() {
      if (right >= s.length) {
        currentOperationEl.textContent = `完成！最长无重复子串的长度是 ${maxLength}。`;
        currentOperationEl.className = "alert alert-success";
        if (isRunning) {
            clearInterval(intervalId);
            isRunning = false;
            runBtn.textContent = "自动";
        }
        updateDisplay(); // Final render
        return false;
      }

      const char = s[right];
      
      if (!charSet.has(char)) {
        // Expand window
        charSet.add(char);
        currentOperationEl.textContent = `[扩展] 窗口右侧加入新字符'${char}'。窗口内无重复，计算新长度。`;
        currentOperationEl.className = "alert alert-primary";
        maxLength = Math.max(maxLength, right - left + 1);
        right++;

      } else {
        // Shrink window
        currentOperationEl.textContent = `[收缩] 字符'${char}'在窗口中已存在。正在从左侧移除字符'${s[left]}'。`;
        currentOperationEl.className = "alert alert-warning";
        charSet.delete(s[left]);
        left++;
      }
      
      updateDisplay();
      return true;
    }

    // Event listeners
    inputStrEl.addEventListener('input', resetAlgorithm);
    
    stepBtn.addEventListener('click', () => {
      if(isRunning) return;
      stepAlgorithm();
    });

    runBtn.addEventListener('click', () => {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        runBtn.textContent = "自动";
      } else {
        isRunning = true;
        runBtn.textContent = "停止";
        stepAlgorithm(); // Run first step immediately
        intervalId = setInterval(stepAlgorithm, 800);
      }
    });

    resetBtn.addEventListener('click', resetAlgorithm);

    // Initialize
    resetAlgorithm();
  </script>
</body>
</html>
