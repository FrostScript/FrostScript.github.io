<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>无重复字符的最长子串 - 算法演示</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .char-box { display: inline-block; width: 30px; height: 30px; line-height: 30px; text-align: center; margin: 2px; border: 1px solid #ccc; border-radius: 4px; background: white; }
    .char-active { background: #0d6efd; color: white; border-color: #0d6efd; }
    .char-in-temp { background: #e9ecef; }
    .highlight { background-color: #fff3cd; padding: .2em .4em; border-radius: .3rem; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">无重复字符的最长子串</h1>
        <a href="." class="btn btn-sm btn-outline-secondary">返回索引</a>
    </div>
    <div class="row">
      <div class="col-lg-5 mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">控制面板</h5>
            <div class="mb-3">
              <label for="inputStr" class="form-label">输入字符串:</label>
              <input id="inputStr" type="text" class="form-control" value="abcabcbb" placeholder="输入字符串">
            </div>
            <div class="d-flex gap-2 mb-3">
              <button id="stepBtn" class="btn btn-primary">单步执行</button>
              <button id="runBtn" class="btn btn-secondary">自动运行</button>
              <button id="resetBtn" class="btn btn-danger">重置</button>
            </div>
            <div class="card bg-light">
                <div class="card-body">
                    <h6 class="card-subtitle mb-2 text-muted">当前状态</h6>
                    <p class="mb-1">当前子串: <span id="tempDisplay" class="highlight">""</span></p>
                    <p class="mb-1">当前长度: <span id="tempLen" class="highlight">0</span></p>
                    <p class="mb-1">最大长度: <span id="maxLen" class="highlight">0</span></p>
                    <p class="mb-0">当前字符: <span id="currentChar" class="highlight">-</span></p>
                </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7 mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">执行过程</h5>
            <div class="mb-3">
              <h6>字符串可视化:</h6>
              <div id="stringVisualization" class="p-3 bg-light rounded font-monospace"></div>
            </div>
            <div class="mb-3">
                <h6>当前操作:</h6>
                <div id="currentOperation" class="alert alert-info" role="alert">等待输入...</div>
            </div>
            <div>
              <h6>算法步骤:</h6>
              <div id="algorithmSteps" class="small text-muted">
                1. 初始化一个空map和左右指针l,r=0,0。<br>
                2. 右指针r向右移动，取到新字符。<br>
                3. 如果map中已存在该字符，更新左指针l到重复字符的下一位。<br>
                4. 将当前字符和它的索引存入map。<br>
                5. 更新最大长度 (r - l + 1)。
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DOM references
    const inputStr = document.getElementById('inputStr');
    const stepBtn = document.getElementById('stepBtn');
    const runBtn = document.getElementById('runBtn');
    const resetBtn = document.getElementById('resetBtn');
    const tempDisplay = document.getElementById('tempDisplay');
    const tempLen = document.getElementById('tempLen');
    const maxLen = document.getElementById('maxLen');
    const currentChar = document.getElementById('currentChar');
    const stringVisualization = document.getElementById('stringVisualization');
    const currentOperation = document.getElementById('currentOperation');

    // Algorithm state
    let s = "abcabcbb";
    let left = 0;
    let maxLength = 0;
    let charIndexMap = new Map();
    let currentIndex = 0;
    let isRunning = false;
    let intervalId = null;

    function renderString() {
      stringVisualization.innerHTML = '';
      for (let i = 0; i < s.length; i++) {
        const charBox = document.createElement('span');
        charBox.className = 'char-box';
        charBox.textContent = s[i];
        if (i === currentIndex) {
          charBox.classList.add('char-active');
        } else if (i >= left && i < currentIndex) {
          charBox.classList.add('char-in-temp');
        }
        stringVisualization.appendChild(charBox);
      }
    }

    function updateDisplay() {
        let currentSubstring = s.substring(left, currentIndex);
        tempDisplay.textContent = `"${currentSubstring}"`;
        tempLen.textContent = currentSubstring.length;
        maxLen.textContent = maxLength;
        currentChar.textContent = currentIndex < s.length ? s[currentIndex] : '-';
        renderString();
    }
    
    function resetAlgorithm() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        runBtn.textContent = "自动运行";
      }
      s = inputStr.value || "abcabcbb";
      left = 0;
      maxLength = 0;
      charIndexMap.clear();
      currentIndex = 0;
      currentOperation.textContent = "算法已重置，点击“单步执行”或“自动运行”开始。";
      updateDisplay();
    }

    function stepAlgorithm() {
      if (currentIndex >= s.length) {
        currentOperation.textContent = "算法已完成！最长子串长度为: " + maxLength;
        if (isRunning) {
            clearInterval(intervalId);
            isRunning = false;
            runBtn.textContent = "自动运行";
        }
        return false;
      }

      const char = s[currentIndex];
      if (charIndexMap.has(char) && charIndexMap.get(char) >= left) {
        const prevIndex = charIndexMap.get(char);
        currentOperation.textContent = `字符 '${char}' 重复。将左边界从 ${left} 移动到 ${prevIndex + 1}。`;
        left = prevIndex + 1;
      } else {
        currentOperation.textContent = `字符 '${char}' 不重复，扩展窗口。`;
      }
      
      charIndexMap.set(char, currentIndex);
      maxLength = Math.max(maxLength, currentIndex - left + 1);
      
      currentIndex++;
      updateDisplay();
      
      return true;
    }

    // Event listeners
    inputStr.addEventListener('input', resetAlgorithm);
    
    stepBtn.addEventListener('click', () => {
      if(isRunning) return;
      stepAlgorithm();
    });

    runBtn.addEventListener('click', () => {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        runBtn.textContent = "自动运行";
      } else {
        isRunning = true;
        runBtn.textContent = "停止运行";
        intervalId = setInterval(stepAlgorithm, 800);
      }
    });

    resetBtn.addEventListener('click', resetAlgorithm);

    // Initialize
    resetAlgorithm();
  </script>
</body>
</html>
